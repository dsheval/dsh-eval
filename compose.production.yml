services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dsh-eval-web:latest
    container_name: dsh-eval-web
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/dsheval').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - top100_proxy

networks:
  top100_proxy:
    external: true
    name: dsh-top100_default
