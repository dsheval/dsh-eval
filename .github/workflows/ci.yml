name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit all dependencies
        run: npm run audit:security

      - name: Lint and typecheck
        run: |
          npm run lint
          npx tsc --noEmit --incremental false

      - name: Test legacy website links
        run: node --test scripts/test-legacy-links.mjs

      - name: Test evaluation suites
        run: |
          npm run test:deep-research
          npm run test:search
          npm run test:memory

      - name: Validate server configuration
        run: |
          docker compose -p dsh-eval -f compose.production.yml -f docker/compose.server.example.yml config --quiet
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: dsh-eval-web:ci
          cache-from: type=gha,scope=dsh-eval-web
          cache-to: type=gha,scope=dsh-eval-web,mode=max

      - name: Verify production container
        run: |
          docker run -d --name dsheval-ci -p 127.0.0.1:3301:3000 dsh-eval-web:ci
          ready=0
          for _ in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3301/ >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          node scripts/smoke-production.mjs http://127.0.0.1:3301

      - name: Show container logs on failure
        if: failure()
        run: docker logs --tail 100 dsheval-ci 2>&1 || true

      - name: Remove CI container
        if: always()
        run: docker rm -f dsheval-ci 2>/dev/null || true
